<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리가 만드는 바른 디지털 세상 캠페인</title>
<style>
@font-face {
  font-family: 'GangwonEduPowerExtraBoldA'; /* 강원교육튼튼 */
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEduPowerExtraBoldA.woff') format('woff');
  font-display: swap;
}
@font-face {
  font-family: 'GangwonEdu_OTFBoldA'; /* 강원교육모두 Bold */
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');
  font-display: swap;
}
:root {
  --bg: #e6f4fd; --card: #ffffff; --ink: #1f2d3d; --muted: #4c5c6e; --line: #c6d6e4;
  --yellow: #ffd84d; --lime: #d9f2a5; --coral: #c8452f; --good: #1b7a3f; --warn: #a34a00;
  --s1: #1d5fbf; --s2: #6b3fb5; --s3: #1b7a3f; --s4: #b4500a; --sc: var(--s1);
  --s1l: #e3eefc; --s2l: #efe7fb; --s3l: #e2f4e8; --s4l: #fdeddf; --scl: var(--s1l);
}
body[data-step="2"] { --sc: var(--s2); --scl: var(--s2l); }
body[data-step="3"] { --sc: var(--s3); --scl: var(--s3l); }
body[data-step="4"] { --sc: var(--s4); --scl: var(--s4l); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; font-size: 18px;
  font-family: 'GangwonEdu_OTFBoldA', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1, h2, h3, .title, .step-label, .basket-title, .praise {
  font-family: 'GangwonEduPowerExtraBoldA', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  line-height: 1.35; margin: 0 0 .4em; font-weight: 400;
}
h2 { font-size: 1.6rem; outline: none; } h3 { font-size: 1.2rem; }
p { margin: .3em 0 .7em; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #0b4fa8; outline-offset: 2px; }
h1:focus, h2:focus { outline: none; }
.hidden { display: none !important; }

/* 버튼 */
.btn {
  min-height: 48px; min-width: 48px; padding: 8px 18px; border-radius: 14px; border: 2px solid var(--sc);
  background: #fff; color: var(--sc); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none; text-align: center;
}
.btn.primary { background: var(--sc); color: #fff; }
.btn.danger { border-color: var(--coral); color: var(--coral); }
.btn.danger.primary { background: var(--coral); color: #fff; }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn[disabled] { background: #e4e9ee; color: #55626f; border-color: #aab6c2; cursor: not-allowed; }
.chip {
  min-height: 48px; padding: 6px 14px; border-radius: 24px; border: 2px solid var(--line); background: #fff;
}
.chip[aria-pressed="true"] { background: var(--sc); border-color: var(--sc); color: #fff; }
.chip[aria-pressed="true"]::before { content: '✔ '; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.term {
  background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: help;
  border-bottom: 2px dotted currentColor; min-height: 0;
}

/* 입력 */
label.field { display: block; margin: 12px 0; }
input[type=text], input[type=password], input[type=url], textarea, select {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 2px solid #8496a8; background: #fff;
}
textarea { min-height: 96px; resize: vertical; }
.check { display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; }
.check input { width: 26px; height: 26px; flex: none; accent-color: var(--sc); }

/* 레이아웃 */
#top { background: #fff; border-bottom: 3px solid var(--sc); position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 1040px; margin: auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.stepper { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; margin: 0; padding: 0; min-width: 0; }
.stepbtn {
  width: 100%; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: #fff; padding: 4px 6px;
  display: flex; align-items: center; justify-content: center; gap: 4px; font-size: .92rem;
}
.stepbtn .step-label { margin: 0; }
.stepbtn.cur { color: #fff; border-color: transparent; }
.stepbtn.cur.n1 { background: var(--s1); } .stepbtn.cur.n2 { background: var(--s2); }
.stepbtn.cur.n3 { background: var(--s3); } .stepbtn.cur.n4 { background: var(--s4); }
.stepbtn[disabled] { color: #55626f; background: #eef2f5; cursor: not-allowed; }
main { max-width: 1040px; margin: auto; padding: 16px; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.subtab { min-height: 48px; padding: 4px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: .92rem; }
.subtab.cur { background: var(--sc); color: #fff; border-color: var(--sc); }
.subtab[disabled] { color: #55626f; background: #eef2f5; cursor: not-allowed; }
.card { background: var(--card); border-radius: 18px; padding: 16px 18px; margin: 12px 0; box-shadow: 0 2px 0 #c9dcea; }
.ask { background: var(--scl); border-left: 8px solid var(--sc); }
.ask h2 { color: var(--sc); margin: 0; }
.tint { background: #fff8d9; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grid2 > .card, .grid3 > .card, .grid4 > .card { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); font-size: .92rem; }
.nav { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; padding-right: 92px; }
.nav .need { flex: 1; min-width: 160px; color: var(--warn); font-size: .95rem; }

/* 뉴스 */
.tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: .85rem; border: 2px solid; background: #fff; }
.t0 { color: #a3262b; } .t1 { color: #5b2aa8; } .t2 { color: #0a6450; } .t3 { color: #8a4b00; }
.news h3 { margin-top: 6px; }
.help { background: #eaf8ee; border-radius: 10px; padding: 8px 10px; font-size: .92rem; margin: 8px 0; }
.q { background: #fff8d9; border-radius: 10px; padding: 8px 10px; }
.src { background: #f1f5f9; border-radius: 10px; padding: 8px 10px; font-size: .92rem; }

/* 수칙 */
.okline { color: var(--good); } .noline { color: var(--warn); }
.ruleprev { background: linear-gradient(135deg, #fff8d9, #d9f2a5); border-radius: 18px; padding: 18px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
.ruleprev b { font-family: 'GangwonEduPowerExtraBoldA', sans-serif; font-weight: 400; font-size: 1.15rem; }

/* 프롬프트 */
.prompt-out { background: #fff; border: 2px dashed var(--sc); border-radius: 14px; padding: 12px; font-size: 1.1rem; line-height: 2.1; }
.pb { border-bottom: 4px solid; padding-bottom: 1px; }
.pb small { font-size: .62em; color: var(--muted); margin-left: 2px; }
.pb-who { border-color: #d6336c; } .pb-what { border-color: #e8590c; } .pb-where { border-color: #2b8a3e; }
.pb-mood { border-color: #1971c2; } .pb-style { border-color: #7048e8; } .pb-color { border-color: #c29d00; }
.stars { font-size: 1.3rem; color: #a56b00; }
.warnbox { background: #ffe9e3; border: 2px solid var(--coral); border-radius: 12px; padding: 8px 12px; margin: 8px 0; }

/* 조립기: 완성 문장이 늘 보이게 */
.builder { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.builder > .card { margin: 0; }
.builder .outcard { position: sticky; top: 84px; }

/* 타이머 */
.minis { position: sticky; top: 76px; z-index: 5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.mini { background: #fff; border: 2px solid var(--sc); border-radius: 12px; padding: 4px 6px; text-align: center; font-size: .85rem; }
.ring { width: 220px; height: 220px; display: block; margin: auto; position: relative; }
.ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .num b { font-family: 'GangwonEduPowerExtraBoldA', sans-serif; font-weight: 400; font-size: 2.6rem; }
.ring.warn circle.bar { stroke: var(--coral); } .ring.warn .num b { color: var(--coral); }

/* 디지랑 */
#digi { position: fixed; right: 12px; bottom: 10px; z-index: 30; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; }
#digiBtn { pointer-events: auto; width: 76px; height: 88px; background: none; border: 0; padding: 0; }
#bubble {
  pointer-events: auto; max-width: min(320px, 68vw); background: #fff; border: 3px solid var(--sc); border-radius: 16px 16px 4px 16px;
  padding: 8px 12px; font-size: .98rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); margin-bottom: 40px;
}
#saved { position: fixed; left: 10px; bottom: 6px; z-index: 15; font-size: .8rem; color: var(--good); background: #fff; padding: 1px 8px; border-radius: 8px; opacity: 0; transition: opacity .3s; }
#saved.on { opacity: 1; } #saved.bad { color: var(--coral); }

/* 노트, 모달 */
#noteWrap, #modalWrap, #overlay { position: fixed; inset: 0; z-index: 40; }
#noteWrap { background: rgba(20,40,60,.4); }
#note { position: absolute; right: 0; top: 0; bottom: 0; width: min(440px, 100%); background: #fff; padding: 16px; overflow-y: auto; }
#note section { border-top: 2px solid var(--line); padding: 8px 0; }
.noteitem { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 6px 0; }
.noteitem > span { min-width: 0; }
#modalWrap { z-index: 60; background: rgba(20,40,60,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal { background: #fff; border-radius: 18px; padding: 18px; width: min(460px, 100%); max-height: 90vh; overflow-y: auto; }
#overlay { z-index: 50; background: var(--bg); overflow-y: auto; }
#pop { position: fixed; z-index: 70; background: #17324d; color: #fff; padding: 10px 12px; border-radius: 12px; max-width: 280px; font-size: .95rem; }
#questionShow { position: fixed; inset: 0; z-index: 55; background: #17324d; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 5vw; }
#questionShow h1 { font-size: clamp(2rem, 6vw, 5rem); }
.lvl { min-height: 56px; padding: 6px 12px; border-radius: 14px; border: 2px solid var(--line); background: #fff; }
.lvl[aria-pressed="true"] { background: var(--sc); color: #fff; border-color: var(--sc); }
.lvl[aria-pressed="true"]::before { content: '✔ '; }
.script { background: #fff8d9; border-radius: 12px; padding: 12px; line-height: 1.9; }
.confetti { position: fixed; top: -14px; width: 10px; height: 14px; z-index: 80; pointer-events: none; animation: fall 2s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .7; } }
.fade { animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .fade, .confetti { animation: none; } .confetti { display: none; } }

/* 시작 화면 */
.hero { text-align: center; padding: 20px 0 6px; }
.hero h1 { font-size: clamp(1.8rem, 4.5vw, 2.7rem); color: #123f7a; }
.bigq { font-family: 'GangwonEduPowerExtraBoldA', sans-serif; font-size: clamp(1.3rem, 3vw, 1.8rem); background: var(--yellow); border-radius: 18px; padding: 14px 18px; margin: 12px auto; max-width: 820px; line-height: 1.4; }
.stepcard { text-align: center; } .stepcard .ico { font-size: 2.2rem; display: block; }
#lockBtn { position: fixed; left: 8px; bottom: 8px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: #fff; z-index: 16; }

/* 결과 */
#printArea h1 { color: #123f7a; font-size: 1.7rem; }
.res { border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 8px 0; }
.res h3 { margin-bottom: 2px; color: var(--s1); font-size: 1.02rem; }
.res ul, .res ol { margin: 2px 0; padding-left: 22px; }

@media (max-width: 900px) {
  .builder { grid-template-columns: minmax(0, 1fr); }
  .builder .outcard { order: -1; top: 76px; z-index: 4; max-height: 38vh; overflow-y: auto; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
}
@media (max-width: 820px) {
  .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stepbtn { flex-direction: column; font-size: .82rem; gap: 0; }
}
@media (max-width: 560px) {
  body { font-size: 17px; }
  .grid2, .grid3, .grid4 { grid-template-columns: minmax(0, 1fr); }
  .top-in { flex-wrap: wrap; }
  #top { position: static; }
  .builder .outcard, .minis { top: 0; }
  .stepper { order: 2; flex-basis: 100%; }
  .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #digiBtn { width: 58px; height: 68px; }
}
@media print {
  @page { size: A4; margin: 11mm; }
  body { background: #fff; font-size: 10pt; line-height: 1.4; }
  #top, #digi, #saved, #lockBtn, .noprint, .subtabs, .nav, #noteWrap, #modalWrap, #pop, .confetti { display: none !important; }
  main { max-width: none; padding: 0; }
  .card { box-shadow: none; padding: 0; margin: 0; }
  #printArea h1 { font-size: 15pt; margin-bottom: 2pt; }
  .res { break-inside: avoid; padding: 4pt 7pt; margin: 4pt 0; border-width: 1px; }
  .res h3 { font-size: 10.5pt; }
  .printgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8pt; }
}
</style>
</head>

      <circle cx="40" cy="34" r="28" fill="#ffd84d" stroke="#17324d" stroke-width="2.5"/>

      </g>

</div>

<script>
'use strict';
/* ===== 선생님이 바꿀 수 있는 설정 ===== */
const TEACHER_PASSWORD = '1234';
const STORAGE_KEY = 'digitalCampaign_v1';
const CONTENT_KEY = 'digitalCampaign_v1_content'; // 교사가 편집한 기사·보기(학생 데이터 초기화에도 유지)
const CANVA_URL = 'https://www.canva.com';

/* ===== 기본 내용 ===== */
const TOPICS = ['사이버 예절', '가짜 정보·AI 합성', '스마트폰 과의존', '개인정보·저작권'];
const DEFAULT_ARTICLES = [
  { id: 'a1', topic: '사이버 예절', press: '미주헤럴드경제', date: '2026.02.11', title: '“김길리 넘어뜨린 그 선수” 악플 폭주에 댓글 닫고 결국 사과 [2026 동계올림픽]', url: 'https://www.heraldk.com/article/2026021102054019463',
    kidSummary: '올림픽 쇼트트랙 경기에서 한 미국 선수가 미끄러져 넘어지면서 뒤따르던 우리나라 선수와 부딪쳤어요. 경기가 끝난 뒤 그 선수의 SNS에 한국어와 영어로 된 비난 댓글이 많이 달렸고, 선수는 댓글 창을 닫았어요. 선수는 일부러 한 일이 아니었다며 사과했어요.',
    question: '일부러 한 일이 아닌데 비난 댓글을 많이 받은 선수의 마음은 어땠을까요?', teacherOnly: false },
  { id: 'a2', topic: '사이버 예절', press: 'YTN', date: '2026.06.26', title: '남아공전 패배 직후, 설영우 측 "악플 고소"...팬들 "이게 맞아?" [앵커리포트]', url: 'https://www.ytn.co.kr/_ln/0107_202606261301212225',

  { id: 'a6', topic: '가짜 정보·AI 합성', press: '머니투데이', date: '2026', title: "청소년 토론캠프 'AI윤리 ON' 관련 기사", url: 'https://www.mt.co.kr/planning/4639',

/* 복사 */
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
async function doCopy(text, btn) {
  if (!text) { say('아직 복사할 내용이 없어요.'); return; }
  if (await copyText(text)) {
    if (btn && btn.isConnected) { const o = btn.textContent; btn.textContent = '복사했어요 ✓'; setTimeout(() => { if (btn.isConnected) btn.textContent = o; }, 1300); }
    say('복사했어요! 필요한 곳에 붙여 넣어요.');
  } else {
    openModal({ title: '직접 복사해요', body: `<p>글자가 선택되어 있어요. 길게 누르거나 Ctrl+C로 복사해요.</p><textarea id="copyFallback" readonly>${esc(text)}</textarea>`, actions: [{ label: '닫기', primary: true }] });
    const t = $('#copyFallback'); t.focus(); t.select();
  }
}

const TM = { left: null, end: 0, id: null };
const RING = 2 * Math.PI * 92;
function updateTimer() {
  if (TM.left == null) TM.left = state.targetSec;
  const r = $('#ring'); if (!r) return;
  const s = Math.max(0, Math.ceil(TM.left));
  $('#tNum').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  $('#tBar').style.strokeDashoffset = RING * (1 - TM.left / state.targetSec);
  r.classList.toggle('warn', s <= 30);
  $('#tNote').textContent = s === 0 ? '시간이 끝났어요' : s <= 30 ? '30초 안쪽이에요' : '남은 시간';
  $('#tToggle').textContent = TM.id ? '⏸ 잠깐 멈춤' : '▶ 시작';
}
function pauseTimer() { clearInterval(TM.id); TM.id = null; }
function finishPractice() {
  pauseTimer(); TM.left = state.targetSec; state.practiceCount++;
  saveNow(); render(); refreshNav();
  say(`연습 ${state.practiceCount}회 끝! 소리 내어 연습한 만큼 더 또렷해져요.`);
}
function toggleTimer() {
  if (TM.id) { pauseTimer(); updateTimer(); return; }
  if (TM.left <= 0) TM.left = state.targetSec;
  TM.end = Date.now() + TM.left * 1000;
  TM.id = setInterval(() => {
    TM.left = (TM.end - Date.now()) / 1000;
    if (TM.left <= 0) { TM.left = 0; finishPractice(); return; }
    updateTimer();
  }, 200);
  updateTimer();
}

const REC = { supported: !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia), mr: null, url: null };
async function recStart() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream), chunks = [];
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (REC.url) URL.revokeObjectURL(REC.url);
      REC.url = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType })); REC.mr = null;
      if (state.screen === '4-3') render();
    };
    mr.start(); REC.mr = mr; render();
  } catch (e) { REC.supported = false; render(); }
}
function recStop() { if (REC.mr && REC.mr.state !== 'inactive') REC.mr.stop(); }

}
function renderTeacher() {
  const o = $('#overlay'), tabs = [['articles', '뉴스 기사'], ['rules', '수칙 예시'], ['blocks', '프롬프트 블록'], ['show', '발문 보기'], ['data', '이동·데이터']];
  let body = '';
  if (ui.tTab === 'articles') body = teacherArticles();
  if (ui.tTab === 'rules') body = `<div class="card"><p class="muted">한 줄에 예시 하나씩 적어요.</p>${TOPICS.map((t, i) => `<label class="field">${esc(t)}<textarea id="re${i}">${esc((content.ruleExamples[t] || []).join('\n'))}</textarea></label>`).join('')}<button type="button" class="btn primary" data-act="saveRules">저장</button></div>`;
  if (ui.tTab === 'blocks') body = `<div class="card"><p class="muted">한 줄에 보기 하나씩 적어요.</p>${BLOCK_META.map(m => `<label class="field">${esc(m.label)}<textarea id="bl-${m.k}">${esc((content.blocks[m.k] || []).join('\n'))}</textarea></label>`).join('')}<button type="button" class="btn primary" data-act="saveBlocks">저장</button></div>`;
  if (ui.tTab === 'show') body = `<div class="card"><p>각 단계 발문을 전자칠판용 큰 글씨로 보여 줍니다.</p><button type="button" class="btn primary" data-act="qShow">발문 보기 시작</button></div>`;
  if (ui.tTab === 'data') body = `<div class="card"><h3>자유 이동</h3><p>교사 모드가 켜져 있는 동안 모든 단계가 열립니다.</p><div class="chips">${ORDER.map(m => `<button type="button" class="chip" data-act="tGo" data-arg="${m}">${m} ${esc(MISSIONS[m].name)}</button>`).join('')}<button type="button" class="chip" data-act="tGo" data-arg="result">결과 카드</button></div></div>
    <div class="card"><h3>이 기기의 학생 데이터</h3><p>기사와 보기 편집 내용은 그대로 두고 학생 입력만 지웁니다.</p><button type="button" class="btn danger" data-act="resetAsk">학생 데이터 초기화</button></div>
    <div class="card"><button type="button" class="btn" data-act="tLogout">교사 모드 끄기</button></div>`;
  o.innerHTML = `<main><div class="row" style="justify-content:space-between"><h2>교사 모드</h2><button type="button" class="btn" data-act="tClose">닫기</button></div>
    <div class="card tint">⚠️ 수업 전 기사 링크가 열리는지, 내용이 학생에게 적절한지 꼭 확인하세요.</div>
    <div class="chips">${tabs.map(t => `<button type="button" class="chip" aria-pressed="${ui.tTab === t[0]}" data-act="tTab" data-arg="${t[0]}">${t[1]}</button>`).join('')}</div>${ui.msg ? `<p class="okline" role="status">${esc(ui.msg)}</p>` : ''}${body}</main>`;
  ui.msg = ''; o.classList.remove('hidden');
}
function teacherArticles() {
  const a = content.articles.find(x => x.id === ui.editId) || { topic: TOPICS[0], press: '', date: '', title: '', url: '', kidSummary: '', question: '', teacherOnly: false };
  const f = (id, label, v) => `<label class="field">${label}<input type="text" id="${id}" value="${esc(v)}"></label>`;
  return `<div class="card"><div class="row"><button type="button" class="btn small" data-act="aExport">JSON 내보내기</button>
      <label class="btn small">JSON 가져오기<input type="file" id="aImport" accept="application/json,.json" class="hidden"></label></div></div>
    ${content.articles.map(x => `<div class="card noteitem"><span><span class="tag ${topicClass(x.topic)}">${esc(x.topic)}</span> ${x.teacherOnly ? '🔒' : ''} ${esc(x.title)}<br><small class="muted">${esc(x.press)} · ${esc(x.date)}</small></span>
      <span class="row" style="flex:none"><a class="btn small" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">링크</a><button type="button" class="btn small" data-act="aEdit" data-arg="${esc(x.id)}">수정</button><button type="button" class="btn small danger" data-act="aDel" data-arg="${esc(x.id)}">삭제</button></span></div>`).join('')}
    <div class="card"><h3>${ui.editId ? '기사 수정' : '기사 추가'}</h3>
      <label class="field">주제<select id="fTopic">${TOPICS.map(t => `<option ${a.topic === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      ${f('fPress', '언론사', a.press)}${f('fDate', '날짜 (예: 2026.05.19)', a.date)}${f('fTitle', '제목', a.title)}${f('fUrl', 'URL (https://로 시작)', a.url)}
      <label class="field">쉬운 요약<textarea id="fSum">${esc(a.kidSummary)}</textarea></label>${f('fQ', '생각해 볼 질문', a.question)}
      <label class="check"><input type="checkbox" id="fOnly" ${a.teacherOnly ? 'checked' : ''}><span>원문은 교사 모드에서만 열기 (teacherOnly)</span></label>
      <p id="fMsg" class="noline" role="status"></p>
      <div class="row"><button type="button" class="btn primary" data-act="aSave">저장</button>${ui.editId ? '<button type="button" class="btn" data-act="aEdit" data-arg="">취소</button>' : ''}</div></div>`;
}
function pruneScraps() { state.scraps = state.scraps.filter(s => art(s.articleId)); saveNow(); }
function cleanArticle(x, i) {
  const s = k => String(x[k] == null ? '' : x[k]);
  return { id: s('id') || 'imp' + Date.now() + i, topic: TOPICS.includes(x.topic) ? x.topic : TOPICS[0], press: s('press'), date: s('date'), title: s('title'), url: safeUrl(x.url), kidSummary: s('kidSummary'), question: s('question'), teacherOnly: !!x.teacherOnly };
}
function showQuestion() {
  const q = $('#questionShow');
  q.innerHTML = `<p>${ui.qIndex + 1} / ${QUESTIONS.length}</p><h1>${esc(QUESTIONS[ui.qIndex])}</h1>
    <div class="row" style="margin-top:32px"><button type="button" class="btn" data-act="qMove" data-arg="-1">← 이전</button><button type="button" class="btn" data-act="qMove" data-arg="1">다음 →</button><button type="button" class="btn" data-act="qClose">닫기</button></div>`;
  q.classList.remove('hidden');
}
function resetAll() {
  pauseTimer(); TM.left = null; state = defaultState(); ui.ruleTab = 0; ui.filter = '전체'; saveNow();
  $('#overlay').classList.add('hidden'); render(true);
}

/* ===== 동작 ===== */
const toggle = (arr, v) => { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); };
const ACTIONS = {
  bubbleClose() { $('#bubble').classList.add('hidden'); },
  digi() { const m = MISSIONS[state.screen]; say(m ? m.hello : '안녕! 나는 디지랑이에요. 함께 캠페인을 만들어 봐요.'); },
  term(w, el) {
    const p = $('#pop'), r = el.getBoundingClientRect();
    p.textContent = `${w}: ${GLOSSARY[w]}`; p.classList.remove('hidden');
    p.style.left = Math.max(8, Math.min(r.left, innerWidth - p.offsetWidth - 8)) + 'px';
    p.style.top = (r.bottom + p.offsetHeight + 12 > innerHeight ? r.top - p.offsetHeight - 6 : r.bottom + 6) + 'px';
  },
  modal(i) { const a = modalActions[+i]; if (!a.keep) closeModal(); if (a.fn) a.fn(); },
  copy(_, el) { doCopy(el.dataset.text, el); },
  copyScript(_, el) { doCopy(scriptText(), el); },
  start() {
    if (!len(state.name)) { $('#startNeed').textContent = '내 이름을 적어요.'; return; }
    const first = ORDER.find(m => !state.missions[m]);
    go(state.missions['4-4'] ? 'result' : first);
  },
  go(id) { go(id); },
  stepgo(n) { const ms = stepMissions(+n); go(ms.find(m => !state.missions[m]) || ms[0]); },
  next() {
    const id = state.screen;
    if (!MISSIONS[id].need()) state.missions[id] = true;
    const nx = ORDER[ORDER.indexOf(id) + 1] || 'result';
    if (nx === '4-2') fillScript();
    go(nx);
  },
  note() { renderNote(); $('#noteWrap').classList.remove('hidden'); $('#note button').focus(); },
  noteClose() { $('#noteWrap').classList.add('hidden'); },
  filter(t) { ui.filter = t; render(); },
  scrap(id) {
    const i = state.scraps.findIndex(s => s.articleId === id);
    if (i < 0) {
      state.scraps.push({ articleId: id, happened: '', feelings: [], feelingOther: '' }); saveNow(); render();
      say('발표자료에 출처를 꼭 적어야 해요. 다른 사람이 쓴 글을 빌려 올 때 지키는 약속이에요.');
    } else confirmModal('스크랩을 취소할까요?', '이 기사에 쓴 활동 내용도 함께 지워져요.', '취소할게요', () => { state.scraps.splice(i, 1); saveNow(); render(); });
  },
  feeling(arg) { const [i, f] = arg.split('|'); toggle(state.scraps[+i].feelings, f); touch(); },
  topic(t) { state.problemTopic = t; touch(); },
  strategy(id) {
    const i = state.strategies.findIndex(s => s.id === id);
    i < 0 ? state.strategies.push({ id, howToUse: '' }) : state.strategies.splice(i, 1); touch();
  },
  quiz1(arg) { const [i, j] = arg.split('|').map(Number); state.quiz1[i] = j; touch(); },
  quiz2(arg) { const [i, k] = arg.split('|'); state.quiz2[i] = k; touch(); },
  bchip(arg) {
    const [ctx, key, ...r] = arg.split('|'), v = r.join('|'), b = ctxBlocks(ctx);
    b[key] = b[key] === v ? '' : v; syncPrompt(ctx); touch();
    const w = warnings(buildText(b)); if (w.length) say(w[0]);
  },
  ruletab(i) { ui.ruleTab = +i; render(); },
  timer() { toggleTimer(); },
  timerReset() { pauseTimer(); TM.left = state.targetSec; updateTimer(); },
  practiceDone() { finishPractice(); },
  target(v) { pauseTimer(); state.targetSec = +v; TM.left = +v; touch(); },
  rec() { REC.mr ? recStop() : recStart(); },
  level(arg) { const [k, l] = arg.split('|'); state.selfEval[k].level = l; touch(); },
  pledge(r) { state.reflection.pledge = r; touch(); },
  praiseC(k) { state.praise.criterion = state.praise.criterion === k ? '' : k; touch(); },
  print() { window.print(); },
  resetAsk() { confirmModal('처음부터 다시 할까요?', '이 기기에 저장된 학생 입력이 모두 지워져요.', '지우고 다시 하기', resetAll); },
  lock() { teacherLogin(); },
  teacher() { renderTeacher(); },
  tClose() { $('#overlay').classList.add('hidden'); render(); },
  tTab(t) { ui.tTab = t; renderTeacher(); },
  tGo(id) { $('#overlay').classList.add('hidden'); if (id === '4-2') fillScript(); go(id); },
  tLogout() { teacher = false; $('#overlay').classList.add('hidden'); render(); },
  saveRules() { TOPICS.forEach((t, i) => { content.ruleExamples[t] = lines($('#re' + i).value); }); saveContent(); ui.msg = '저장했어요.'; renderTeacher(); },
  saveBlocks() { BLOCK_META.forEach(m => { content.blocks[m.k] = lines($('#bl-' + m.k).value); }); saveContent(); ui.msg = '저장했어요.'; renderTeacher(); },
  qShow() { ui.qIndex = 0; showQuestion(); try { $('#questionShow').requestFullscreen().catch(() => {}); } catch (e) {} },
  qMove(d) { ui.qIndex = (ui.qIndex + +d + QUESTIONS.length) % QUESTIONS.length; showQuestion(); },
  qClose() { $('#questionShow').classList.add('hidden'); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); },
  aEdit(id) { ui.editId = id || null; renderTeacher(); },
  aDel(id) {
    confirmModal('기사를 삭제할까요?', '이 기사를 스크랩한 학생 기록도 함께 빠져요.', '삭제', () => {
      content.articles = content.articles.filter(a => a.id !== id); saveContent(); pruneScraps(); ui.editId = null; ui.msg = '삭제했어요.'; renderTeacher();
    });
  },
  aSave() {
    const v = id => $(id).value.trim(), url = v('#fUrl');
    if (!v('#fPress') || !v('#fDate') || !v('#fTitle') || !v('#fSum')) { $('#fMsg').textContent = '언론사, 날짜, 제목, 쉬운 요약을 적어 주세요.'; return; }
    if (!/^https?:\/\//i.test(url)) { $('#fMsg').textContent = 'URL은 http:// 또는 https://로 시작해야 합니다.'; return; }
    const a = { id: ui.editId || 'a' + Date.now(), topic: v('#fTopic'), press: v('#fPress'), date: v('#fDate'), title: v('#fTitle'), url, kidSummary: v('#fSum'), question: v('#fQ'), teacherOnly: $('#fOnly').checked };
    const i = content.articles.findIndex(x => x.id === a.id);
    i < 0 ? content.articles.push(a) : content.articles[i] = a;
    saveContent(); ui.editId = null; ui.msg = '저장했어요. 학생 화면에 바로 반영됩니다.'; renderTeacher();
  },
  aExport() {
    const u = URL.createObjectURL(new Blob([JSON.stringify(content.articles, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = u; a.download = 'campaign-articles.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
  }
};
const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
function touch() { scheduleSave(); render(); }

document.addEventListener('click', e => {
  const pop = $('#pop');
  const el = e.target.closest('[data-act]');
  if (!(el && el.dataset.act === 'term')) pop.classList.add('hidden');
  if (e.target.id === 'noteWrap') { ACTIONS.noteClose(); return; }
  if (!el || el.disabled) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if (!ACTIONS[act]) return;
  ACTIONS[act](arg, el);
  if (!el.isConnected && document.activeElement === document.body) {
    const same = [...document.querySelectorAll(`[data-act="${act}"]`)].find(x => x.dataset.arg === arg);
    if (same) same.focus();
  }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.bctx) {
    const b = ctxBlocks(d.bctx); b[d.bkey] = el.value; syncPrompt(d.bctx);
    el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    $('#out-' + d.bctx).innerHTML = builderOut(d.bctx);
    scheduleSave(); refreshNav(); return;
  }
  if (!d.path) return;
  setPath(d.path, el.type === 'checkbox' ? el.checked : el.value);
  scheduleSave(); refreshNav();
  if (d.live === 'rule') {
    const i = +d.i, r = state.rules[i], neg = NEGATIVE.some(w => r.includes(w));
    $('#rs' + i).innerHTML = ruleStatus(i);
    if (neg) ui.hadNeg[i] = true;
    else if (ui.hadNeg[i] && len(r)) { ui.hadNeg[i] = false; say("수칙을 '~해요'로 바꿔서 훨씬 따뜻해졌어요!"); }
  }
  if (d.live === 'script') $('#scriptOut').textContent = scriptText();
  if ($('#rulePrev')) $('#rulePrev').innerHTML = rulePreview();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change === 'render') render();
  if (el.id === 'aImport' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data)) throw 0;
        content.articles = data.map(cleanArticle); saveContent(); pruneScraps(); ui.msg = `기사 ${data.length}개를 가져왔어요.`;
      } catch (err) { ui.msg = '파일을 읽지 못했어요. 내보낸 JSON 파일인지 확인해 주세요.'; }
      renderTeacher();
    };
    r.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'tpw') tryLogin();
  if (e.key !== 'Escape') return;
  $('#pop').classList.add('hidden');
  if (!$('#modalWrap').classList.contains('hidden')) closeModal();
  else if (!$('#questionShow').classList.contains('hidden')) ACTIONS.qClose();
  else if (!$('#noteWrap').classList.contains('hidden')) ACTIONS.noteClose();
});

/* 시작 */
if (state.screen !== 'start' && state.screen !== 'result' && !MISSIONS[state.screen]) state.screen = 'start';
render(true);
if (state.screen === 'start') say('안녕! 나는 디지랑이에요. 함께 캠페인을 만들어 봐요.');
else if (MISSIONS[state.screen]) say(MISSIONS[state.screen].hello);
</script>
</body>
</html>
